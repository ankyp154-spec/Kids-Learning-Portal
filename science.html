<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header { background-color: #74b9ff;}
        footer { background-color: #0984e3; padding: 10px; }

        .science-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 40px auto;
            width: 85%;
        }

        .science-grid {
            background-color: #D8BFD8;
            border-radius: 10px;
            padding: 15px;
            text-align: center;


        }

        .science-card {
            background-color: #ecf5ff;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: o 3px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;

        }

        .science-card:hover {
            transform: translateY(-5px);
        }

        .science-card img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        
    </style>
</head>

<body>
    <div style="text-align:center;"
    <div src="image/science.jpg" class="img-placeholder" alt="Science Learning Program">

    

    </div>

    <h2>The world of Science Around Us</h2>

    <p></p>

    <p></p>

    <div class="header">
        <h1>Grade 5 Science</h1>
    </div>

    <div class="content">
        <div style="text-align: center;">
            <h2>Chapters:</h2>
            <ol style="display: inline-block; text-align: left;">
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ol> 
        
        
        <h2>Watch & Learn:</h2>
        <iframe width="560" height="315"
                src=""
                title=""
                frameborder=""
                referrerpolicy=""
                allowfullscreen>
            </iframe>
    </div>

    <section>
        <h2 style="text-align: center; margin-top: 40px">Explore Science Concepts</h2>
        <div class="science-grid">
            <figure class="science-card">
                <img src="plant_life.jpg" alt="Plant Life">
                <figcaption></figcaption>
            </figure>

            <figure class="science-card">
                <img src="human-body.jpg" alt="Human Body">
                <figcaption></figcaption>
            </figure>

            <figure class="science-card">
                <img src="form_of_matter.jpg" alt="State of Matter">
                <figcaption></figcaption>
            </figure>

            <figure class="science-card">
                <img src="images/solar-system.png" alt="Solar System">
                <figcaption></figcaption>
            </figure>
        </div>
    </section>

    <footer>Explore Science, Discover the World!</footer>
</body>
</html>
